<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410">
  <defs>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a4a"/>
      <stop offset="0.55" stop-color="#5d3a32"/>
      <stop offset="1" stop-color="#38231f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="410" fill="#14181e"/>
  <text x="40" y="46" fill="#e8edf5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700">为什么“接笔”会留下接缝</text>
  <text x="40" y="72" fill="#8b98a9" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">两笔各有自己的起笔/收笔衰减；一条曲线只有一次成笔。</text>

  <!-- Row 1: two strokes -->
  <text x="40" y="132" fill="#f08a7a" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600">两笔接续</text>
  <text x="40" y="154" fill="#8b98a9" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">第二笔的起跑线</text>

  <path d="M190 108 C240 128 240 170 290 190 L390 230" fill="none" stroke="url(#lock)" stroke-width="46" stroke-linecap="round"/>
  <path d="M410 242 C460 262 470 300 520 318 L620 352" fill="none" stroke="url(#lock)" stroke-width="46" stroke-linecap="round"/>
  <path d="M190 108 C240 128 240 170 290 190 L390 230" fill="none" stroke="#2a1a16" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
  <path d="M410 242 C460 262 470 300 520 318 L620 352" fill="none" stroke="#2a1a16" stroke-width="13" stroke-linecap="round" opacity="0.85"/>

  <path d="M398 218 L402 244" stroke="#f08a7a" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="400" cy="231" r="9" fill="none" stroke="#f08a7a" stroke-width="2.5"/>
  <text x="418" y="222" fill="#f08a7a" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">接缝：变浅 / 台阶 / 双线</text>

  <!-- Row 2: one curve -->
  <text x="40" y="290" fill="#6fd3c7" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600">一条曲线</text>
  <text x="40" y="312" fill="#8b98a9" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">所有段都是控制段</text>

  <path d="M190 272 C240 292 240 334 290 352 L620 352 C670 352 680 310 730 290" fill="none" stroke="url(#lock)" stroke-width="46" stroke-linecap="round"/>
  <path d="M190 272 C240 292 240 334 290 352 L620 352 C670 352 680 310 730 290" fill="none" stroke="#2a1a16" stroke-width="13" stroke-linecap="round" opacity="0.85"/>

  <g transform="translate(752,272)">
    <circle r="12" fill="#1f3b35" stroke="#6fd3c7" stroke-width="2"/>
    <path d="M-6 0 L-1 5 L7 -5" fill="none" stroke="#6fd3c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="772" y="294" fill="#6fd3c7" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">一次成笔，无接缝</text>

  <text x="40" y="392" fill="#6f7d8f" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">HairFlow 把“第二笔”消灭掉：不是把两段焊起来，而是让它们从来就是同一条曲线。</text>
</svg>
